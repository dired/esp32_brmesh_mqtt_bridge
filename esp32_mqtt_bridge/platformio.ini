[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	dawidchyrzynski/home-assistant-integration@^2.1.0
	arduino-libraries/ArduinoBLE@^1.3.6
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_filters = esp32_exception_decoder
; Select which mesh this build targets (see src/config.h). Options:
;   -D BRMESH_MESH=BRMESH_OLD    (placeholder key 12345678)
;   -D BRMESH_MESH=BRMESH_PAUL   (placeholder key 12345678)  <- default
build_flags = -D BRMESH_MESH=BRMESH_PAUL

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
	dawidchyrzynski/home-assistant-integration@^2.1.0
	arduino-libraries/ArduinoBLE@^1.3.6
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.filesystem = littlefs
; Select which mesh this build targets (see src/config.h).
build_flags = -D BRMESH_MESH=BRMESH_PAUL