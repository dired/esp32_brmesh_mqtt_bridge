; PlatformIO config for the BRMesh passive BLE sniffer -> WiFi/UDP bridge.
;
; Same passive BRMesh sniffer as the original serial sniffer, but instead of (only)
; pushing packets over USB serial, it broadcasts each `BLE|...` line as a UDP
; datagram to the local subnet broadcast, and announces itself via mDNS so the
; host can find it without knowing its IP:
;
;   pio run -e esp32s3 -t upload   # flash an ESP32-S3 over USB
;   pio device monitor -e esp32s3  # also still shows serial output
;
; Host side:  python3 monitor_remote.py   (UDP listener + decode)
;
; Set your WiFi SSID/pass in src/*.ino before flashing.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv   ; 3MB app partition (no OTA) for 4MB flash
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
